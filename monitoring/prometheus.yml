# Used by the `observability` Compose profile. On Kubernetes, scrape via the
# prometheus.io/* pod annotations or a ServiceMonitor instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fde-03-evaluation
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
  # The system under test (fde-02), when the `sut` profile runs: live answer metrics next to
  # the evaluation gauges.
  - job_name: fde-02-llm-applications
    metrics_path: /metrics/
    static_configs:
      - targets: ["sut:8000"]
